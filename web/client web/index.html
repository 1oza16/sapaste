<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SApaste, el mejor clipboard online">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="../img/sapaste-icon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <title>SApaste</title>
</head>
<body>
    <header>
        <h3 class="Logo">
            <img src="../img/sapaste-logo-dark.png" alt="SApaste" class="logo-claro" width="350px">
            <img src="../img/sapaste-logo-white.png" alt="SApaste" class="logo-oscuro" width="350px">
        </h3>
    </header>
    <main>
        <div class="CuadroTexto">
            <!-- Estado + Reloj -->
            <div class="estado-bar">
                <div class="estado-badge sin-guardar" id="estadoBadge">
                    <span id="estadoPunto">●</span>
                    <span id="estadoTexto">Sin guardar</span>
                </div>
                <span class="reloj" id="reloj">00:00:00</span>
            </div>

            <!-- Título -->
            <input 
                type="text" 
                id="tituloClipboard" 
                placeholder="Título del clipboard..." 
                style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--cuadro-bg); color: var(--texto-color); font-size: 16px;"
            >

            <!-- URL y acciones -->
            <div class="url-acciones">
                <div id="urlClipboard">URL: (aún no generada)</div>
                <button class="btn-url" id="btnCopiarUrl" onclick="copiarUrl()" disabled>Copiar</button>
                <div class="compartir-menu">
                    <button class="btn-url" id="btnCompartir" onclick="toggleCompartir()" disabled>Compartir</button>
                    <div class="compartir-dropdown" id="compartirDropdown">
                        <a class="compartir-opcion" id="shareWhatsapp" href="#" target="_blank">WhatsApp</a>
                        <a class="compartir-opcion" id="shareGmail"    href="#" target="_blank">Gmail</a>
                        <a class="compartir-opcion" id="shareTelegram" href="#" target="_blank">Telegram</a>
                        <div class="compartir-opcion" onclick="shareNativo()">Más opciones...</div>
                    </div>
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-izq">
                    <button onclick="negrita()"><b>B</b></button>
                    <button onclick="cursiva()"><i>I</i></button>
                    <button onclick="subrayado()"><u>U</u></button>
                
                    <span class="separator"></span>
                
                    <button onclick="cmd('justifyLeft')">⯇</button>
                    <button onclick="cmd('justifyCenter')">≡</button>
                    <button onclick="cmd('justifyRight')">⯈</button>
                
                    <span class="separator"></span>
                
                    <button onclick="cmd('insertUnorderedList')">• Lista</button>
                    <button onclick="cmd('insertOrderedList')">1. Lista</button>
                
                    <span class="separator"></span>
                
                    <button onclick="toggleDarkMode()" id="btnDarkMode">Modo Oscuro</button>
                </div>
            
                <div class="toolbar-der">
                    <button onclick="guardarContenido()">Guardar</button>
                    <button onclick="cargarContenido()">Recargar</button>
                    <button onclick="eliminarPaste()">Eliminar</button>
                </div>
            </div>

            <div id="editor" contenteditable="true"></div>

            <div id="contador">Caracteres: 0</div>

        </div>
    </main>

    <!-- Historial lateral -->
    <div id="historial-panel">
        <div id="historial-tab">
            <span class="historial-tab-texto">Ver Historial</span>
            <img src="../img/icons/light/history.png" alt="History" class="icono-claro" width="20px" style="margin-top: 5px;">
            <img src="../img/icons/dark/history.png" alt="History" class="icono-oscuro" width="20px" style="margin-top: 5px;">
        </div>
        <div id="historial-contenido">
            <div id="historial-cabecera">
                <span>Historial</span>
                <button id="historial-borrar" onclick="limpiarHistorial()">Limpiar</button>
            </div>
            <div id="historial-lista">
                <div class="historial-vacio" id="historial-vacio">Sin actividad aún</div>
            </div>
        </div>
    </div>

    <!-- Pantalla carga al hacer POST -->
    <div id="spinner-overlay">
        <div class="spinner"></div>
    </div>  

    <!-- Modal confirmación  (Borrado de paste)-->
    <div id="modal-confirmacion">
        <div class="modal-box">
            <h3 id="modalTitulo">¿Estás seguro?</h3>
            <p id="modalMensaje">Esta acción no se puede deshacer</p>
            <div class="modal-botones">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-confirmar" id="btnConfirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal visibilidad al guardar -->
    <div id="modal-visibilidad">
        <div class="modal-box">
            <h3>¿Cómo quieres guardar este paste?</h3>

            <div class="vis-opciones">
                <label class="vis-opcion" id="vis-publico">
                    <input type="radio" name="visibilidad" value="publico" checked>
                    <span class="vis-icono">
                        <img src="../img/icons/light/paste-public.png" alt="Public paste" class="icono-claro" width="23px">
                        <img src="../img/icons/dark/paste-public.png" alt="Public paste" class="icono-oscuro" width="23px">
                    </span>
                    <span class="vis-label">Público</span>
                    <span class="vis-desc">Cualquiera puede ver y editar</span>
                </label>
                <label class="vis-opcion" id="vis-invitados">
                    <input type="radio" name="visibilidad" value="invitados">
                    <span class="vis-icono">
                        <img src="../img/icons/light/paste-guests.png" alt="Paste with guests" class="icono-claro" width="23px">
                        <img src="../img/icons/dark/paste-guests.png" alt="Paste with guests" class="icono-oscuro" width="23px">
                    </span>
                    <span class="vis-label">Privado con invitados</span>
                    <span class="vis-desc">Todos pueden ver, solo tú editas</span>
                </label>
                <label class="vis-opcion" id="vis-estricto">
                    <input type="radio" name="visibilidad" value="estricto">
                    <span class="vis-icono">
                        <img src="../img/icons/light/paste-private.png" alt="Private paste" class="icono-claro" width="23px">
                        <img src="../img/icons/dark/paste-private.png" alt="Private paste" class="icono-oscuro" width="23px">
                    </span>
                    <span class="vis-label">Privado estricto</span>
                    <span class="vis-desc">Solo se accede con contraseña</span>
                </label>
            </div>

            <div id="vis-password-campo" style="display:none; margin-top: 14px;">
                <input 
                    type="password" 
                    id="vis-password-input"
                    placeholder="Contraseña del paste..."
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); background:var(--cuadro-bg); color:var(--texto-color); font-size:14px;"
                >
            </div>

            <div class="modal-botones" style="margin-top: 20px;">
                <button class="btn-cancelar" onclick="cerrarModalVisibilidad()">Cancelar</button>
                <button class="btn-confirmar" style="background:#4a90d9 !important; border-color:#28a745 !important;" onclick="confirmarGuardado()">Guardar</button>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>

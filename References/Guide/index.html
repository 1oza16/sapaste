<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PasteVault — Comparte código</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0e12;
      --surface: #13151c;
      --surface2: #1c1f2b;
      --border: #252836;
      --accent: #5cffb4;
      --accent2: #3de0ff;
      --text: #e8eaf0;
      --muted: #6b7080;
      --danger: #ff5c6c;
      --mono: 'DM Mono', monospace;
      --sans: 'Syne', sans-serif;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── NOISE OVERLAY ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ─── HEADER ─── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(13,14,18,0.92);
      backdrop-filter: blur(16px);
      z-index: 100;
    }

    .logo {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { color: #0d0e12; }

    nav { display: flex; gap: 8px; }

    .btn {
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.3px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-primary {
      background: var(--accent);
      color: #0d0e12;
    }
    .btn-primary:hover { background: #80ffc8; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(92,255,180,0.25); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #ff7c88; }
    .btn-sm { padding: 5px 12px; font-size: 0.76rem; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

    /* ─── MAIN LAYOUT ─── */
    main {
      flex: 1;
      padding: 40px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ─── HERO ─── */
    .hero {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeUp 0.6s ease both;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p { color: var(--muted); font-size: 1rem; font-family: var(--mono); }

    /* ─── EDITOR CARD ─── */
    .editor-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      flex-wrap: wrap;
    }

    .toolbar-dots { display: flex; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ff5c6c; }
    .dot-yellow { background: #ffd166; }
    .dot-green { background: #5cffb4; }

    .toolbar-sep { width: 1px; height: 22px; background: var(--border); }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-family: var(--mono);
      font-size: 0.8rem;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
    }
    select:focus { border-color: var(--accent); }

    .toolbar-title {
      flex: 1;
    }
    .toolbar-title input {
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 600;
      width: 100%;
      outline: none;
      padding: 2px 0;
      transition: border-color 0.2s;
    }
    .toolbar-title input:focus { border-bottom-color: var(--accent); }
    .toolbar-title input::placeholder { color: var(--muted); font-weight: 400; }

    .line-count {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .editor-wrap {
      position: relative;
      display: flex;
    }

    .line-numbers {
      padding: 16px 12px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--muted);
      text-align: right;
      user-select: none;
      min-width: 44px;
      white-space: pre;
    }

    #editor {
      flex: 1;
      min-height: 340px;
      max-height: 60vh;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--mono);
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text);
      padding: 16px;
      tab-size: 2;
      caret-color: var(--accent);
      overflow-y: auto;
    }
    #editor::placeholder { color: var(--muted); }
    #editor::-webkit-scrollbar { width: 6px; }
    #editor::-webkit-scrollbar-track { background: transparent; }
    #editor::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ─── BOTTOM BAR ─── */
    .editor-bottom {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      flex-wrap: wrap;
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .option-group label {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    .toggle-wrap {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .toggle-wrap button {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.77rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-wrap button.active {
      background: var(--accent);
      color: #0d0e12;
      font-weight: 600;
    }

    .pwd-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 4px 10px;
      outline: none;
      width: 120px;
      display: none;
    }
    .pwd-input.visible { display: block; }
    .pwd-input:focus { border-color: var(--accent); }

    .spacer { flex: 1; }

    .char-count {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ─── PASTE RESULT ─── */
    .result-card {
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 14px;
      overflow: hidden;
      animation: slideIn 0.3s ease;
      display: none;
    }
    .result-card.show { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      background: rgba(92,255,180,0.06);
      border-bottom: 1px solid var(--border);
    }
    .result-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #0d0e12;
      font-size: 1rem;
    }
    .result-title { font-weight: 700; font-size: 0.95rem; }
    .result-sub { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }

    .url-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
    }
    .url-box {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
      word-break: break-all;
    }
    .copy-url-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .copy-url-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-url-btn.copied { border-color: var(--accent); color: var(--accent); }

    /* ─── PASTES LIST ─── */
    .section-title {
      font-size: 0.75rem;
      font-family: var(--mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 40px 0 16px;
    }

    .pastes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .paste-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      animation: fadeUp 0.4s ease both;
    }
    .paste-card:hover {
      border-color: var(--muted);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .paste-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .paste-lang-badge {
      font-family: var(--mono);
      font-size: 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      color: var(--accent);
    }
    .paste-meta {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .paste-lock { color: var(--accent2); }

    .paste-card-title {
      padding: 10px 14px 4px;
      font-weight: 700;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .paste-card-preview {
      padding: 0 14px 12px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .paste-card-footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* ─── VIEW MODAL ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 760px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }
    .modal-overlay.open .modal { transform: scale(1); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 { font-size: 1rem; font-weight: 700; }
    .modal-close {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      width: 30px; height: 30px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .modal-close:hover { color: var(--text); border-color: var(--muted); }

    .modal-meta {
      display: flex;
      gap: 20px;
      padding: 10px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .modal-meta span { display: flex; align-items: center; gap: 5px; }
    .modal-meta strong { color: var(--text); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
    }
    .modal-line-nums {
      padding: 16px 12px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--muted);
      text-align: right;
      user-select: none;
      min-width: 44px;
      white-space: pre;
    }
    .modal-code {
      flex: 1;
      padding: 16px;
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* ─── PASSWORD PROMPT ─── */
    .pwd-prompt {
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .pwd-prompt h3 { font-size: 1rem; }
    .pwd-prompt p { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
    .pwd-prompt input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.9rem;
      padding: 10px 16px;
      outline: none;
      width: 220px;
      text-align: center;
    }
    .pwd-prompt input:focus { border-color: var(--accent); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--text);
      z-index: 999;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--accent); }
    .toast.error { border-color: var(--danger); }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 16px 40px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      main { padding: 20px 16px; }
      footer { padding: 12px 16px; flex-direction: column; gap: 8px; }
      .editor-bottom { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<!-- ─── HEADER ─── -->
<header>
  <a class="logo" href="#">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
      </svg>
    </div>
    Paste<span>Vault</span>
  </a>
  <nav>
    <button class="btn btn-ghost btn-sm" onclick="clearEditor()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      Nuevo
    </button>
    <button class="btn btn-primary btn-sm" onclick="submitPaste()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      Guardar Paste
    </button>
  </nav>
</header>

<!-- ─── MAIN ─── -->
<main>
  <div class="hero">
    <h1>Comparte código<br><em>al instante</em></h1>
    <p>// sin registro · sin complicaciones · con estilo</p>
  </div>

  <!-- Editor Card -->
  <div class="editor-card">
    <div class="editor-toolbar">
      <div class="toolbar-dots">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-title">
        <input type="text" id="pasteTitle" placeholder="Sin título..." maxlength="100" />
      </div>
      <div class="toolbar-sep"></div>
      <select id="langSelect">
        <option value="plain">plain text</option>
        <option value="javascript">javascript</option>
        <option value="typescript">typescript</option>
        <option value="python">python</option>
        <option value="csharp">c#</option>
        <option value="java">java</option>
        <option value="cpp">c++</option>
        <option value="html">html</option>
        <option value="css">css</option>
        <option value="sql">sql</option>
        <option value="json">json</option>
        <option value="yaml">yaml</option>
        <option value="bash">bash</option>
        <option value="go">go</option>
        <option value="rust">rust</option>
        <option value="php">php</option>
        <option value="ruby">ruby</option>
        <option value="markdown">markdown</option>
      </select>
      <span class="line-count" id="lineCount">1 línea</span>
    </div>

    <div class="editor-wrap">
      <div class="line-numbers" id="lineNums">1</div>
      <textarea id="editor" spellcheck="false" placeholder="// Pega tu código aquí o empieza a escribir...&#10;&#10;const paste = { url: 'pastevault.io/abc123', views: 0 }"></textarea>
    </div>

    <div class="editor-bottom">
      <div class="option-group">
        <label>⏱ Expira en</label>
        <div class="toggle-wrap" id="expireToggle">
          <button class="active" data-val="never" onclick="setExpiry(this)">nunca</button>
          <button data-val="1h" onclick="setExpiry(this)">1h</button>
          <button data-val="1d" onclick="setExpiry(this)">1d</button>
          <button data-val="7d" onclick="setExpiry(this)">7d</button>
        </div>
      </div>

      <div class="option-group">
        <label>🔒 Contraseña</label>
        <div class="toggle-wrap">
          <button id="noPwdBtn" class="active" onclick="togglePwd(false)">no</button>
          <button id="yesPwdBtn" onclick="togglePwd(true)">sí</button>
        </div>
        <input type="password" class="pwd-input" id="pwdInput" placeholder="••••••••" />
      </div>

      <div class="spacer"></div>
      <span class="char-count" id="charCount">0 chars</span>
      <button class="btn btn-primary" onclick="submitPaste()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
        Publicar
      </button>
    </div>
  </div>

  <!-- Result Card -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="result-icon">✓</div>
      <div>
        <div class="result-title">¡Paste guardado!</div>
        <div class="result-sub" id="resultSub">Expira: nunca · 0 visitas</div>
      </div>
    </div>
    <div class="url-row">
      <div class="url-box" id="resultUrl"></div>
      <button class="copy-url-btn" id="copyUrlBtn" onclick="copyUrl()">📋 Copiar</button>
    </div>
  </div>

  <!-- Recent Pastes -->
  <div class="section-title">// pastes recientes</div>
  <div class="pastes-grid" id="pastesGrid">
    <!-- rendered by JS -->
  </div>
</main>

<!-- ─── VIEW MODAL ─── -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Paste</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-meta" id="modalMeta"></div>
    <div class="modal-body" id="modalBody">
      <!-- content injected -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="copyModalContent()">📋 Copiar contenido</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCurrentPaste()">🗑 Eliminar</button>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cerrar</button>
    </div>
  </div>
</div>

<!-- ─── TOAST ─── -->
<div class="toast" id="toast"></div>

<!-- ─── FOOTER ─── -->
<footer>
  <span>PasteVault &copy; 2025 — Proyecto demostrativo</span>
  <span>Frontend: HTML/CSS/JS · Backend: C# ASP.NET Core · DB: SQL Server</span>
</footer>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG — cambia BASE_URL por tu backend real
// ═══════════════════════════════════════════════════════════
const BASE_URL = 'https://api.pastevault.local'; // <- tu endpoint C#

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let currentExpiry = 'never';
let usePwd = false;
let currentPasteId = null;
let localPastes = JSON.parse(localStorage.getItem('pv_pastes') || '[]');

// ═══════════════════════════════════════════════════════════
// EDITOR — line numbers + char count
// ═══════════════════════════════════════════════════════════
const editor = document.getElementById('editor');
const lineNums = document.getElementById('lineNums');
const lineCount = document.getElementById('lineCount');
const charCount = document.getElementById('charCount');

function updateEditor() {
  const lines = editor.value.split('\n');
  const n = lines.length;
  lineNums.textContent = Array.from({length: n}, (_, i) => i + 1).join('\n');
  lineCount.textContent = n === 1 ? '1 línea' : `${n} líneas`;
  charCount.textContent = `${editor.value.length} chars`;
}

editor.addEventListener('input', updateEditor);
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updateEditor();
  }
});
editor.addEventListener('scroll', () => {
  lineNums.scrollTop = editor.scrollTop;
});

// ═══════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════
function setExpiry(btn) {
  document.querySelectorAll('#expireToggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentExpiry = btn.dataset.val;
}

function togglePwd(on) {
  usePwd = on;
  document.getElementById('noPwdBtn').classList.toggle('active', !on);
  document.getElementById('yesPwdBtn').classList.toggle('active', on);
  document.getElementById('pwdInput').classList.toggle('visible', on);
}

// ═══════════════════════════════════════════════════════════
// SUBMIT PASTE — llama al backend C# o guarda local
// ═══════════════════════════════════════════════════════════
async function submitPaste() {
  const content = editor.value.trim();
  if (!content) { showToast('⚠️ Escribe algo primero', 'error'); return; }

  const payload = {
    title: document.getElementById('pasteTitle').value.trim() || 'Sin título',
    content,
    language: document.getElementById('langSelect').value,
    expiry: currentExpiry,
    password: usePwd ? document.getElementById('pwdInput').value : null
  };

  try {
    // Intenta llamar al backend real
    const res = await fetch(`${BASE_URL}/api/pastes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: AbortSignal.timeout(3000)
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    showResult(data.id, data.url);
  } catch {
    // Fallback: modo demo local
    const id = generateId();
    const paste = { ...payload, id, createdAt: new Date().toISOString(), views: 0 };
    localPastes.unshift(paste);
    if (localPastes.length > 20) localPastes.pop();
    localStorage.setItem('pv_pastes', JSON.stringify(localPastes));
    renderPastes();
    showResult(id, `${location.origin}${location.pathname}?p=${id}`);
  }
}

function showResult(id, url) {
  currentPasteId = id;
  const card = document.getElementById('resultCard');
  document.getElementById('resultUrl').textContent = url;
  const expiryMap = { never: 'nunca', '1h': '1 hora', '1d': '1 día', '7d': '7 días' };
  document.getElementById('resultSub').textContent = `Expira: ${expiryMap[currentExpiry]} · Modo demo local`;
  card.classList.add('show');
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  showToast('✓ Paste guardado', 'success');
}

function copyUrl() {
  const url = document.getElementById('resultUrl').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copyUrlBtn');
    btn.textContent = '✓ Copiado';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copiar'; btn.classList.remove('copied'); }, 2000);
  });
}

function clearEditor() {
  editor.value = '';
  document.getElementById('pasteTitle').value = '';
  document.getElementById('resultCard').classList.remove('show');
  updateEditor();
  editor.focus();
}

// ═══════════════════════════════════════════════════════════
// RENDER PASTES
// ═══════════════════════════════════════════════════════════
function renderPastes() {
  const grid = document.getElementById('pastesGrid');
  if (!localPastes.length) {
    grid.innerHTML = `<div style="color:var(--muted);font-family:var(--mono);font-size:0.8rem;grid-column:1/-1">// Aquí aparecerán tus pastes guardados</div>`;
    return;
  }
  grid.innerHTML = localPastes.map((p, i) => `
    <div class="paste-card" style="animation-delay:${i * 0.05}s" onclick="viewPaste('${p.id}')">
      <div class="paste-card-header">
        <span class="paste-lang-badge">${p.language}</span>
        <span class="paste-meta">
          ${p.password ? '<span class="paste-lock">🔒</span>' : ''}
          ${formatRelative(p.createdAt)}
        </span>
      </div>
      <div class="paste-card-title">${escapeHtml(p.title)}</div>
      <div class="paste-card-preview">${escapeHtml(p.content)}</div>
      <div class="paste-card-footer">
        <span>📄 ${p.content.split('\n').length} líneas</span>
        <span>👁 ${p.views} visitas</span>
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════════
// VIEW MODAL
// ═══════════════════════════════════════════════════════════
function viewPaste(id) {
  const p = localPastes.find(x => x.id === id);
  if (!p) return;

  if (p.password) {
    openPasswordPrompt(p);
    return;
  }
  openModal(p);
}

function openPasswordPrompt(p) {
  currentPasteId = p.id;
  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalMeta').innerHTML = '';
  document.getElementById('modalBody').innerHTML = `
    <div class="pwd-prompt">
      <h3>🔒 Paste protegido</h3>
      <p>Este paste requiere contraseña para verse</p>
      <input type="password" id="unlockInput" placeholder="Contraseña..." onkeydown="if(event.key==='Enter')unlockPaste('${p.id}')" autofocus />
      <button class="btn btn-primary" onclick="unlockPaste('${p.id}')">Desbloquear</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function unlockPaste(id) {
  const p = localPastes.find(x => x.id === id);
  const entered = document.getElementById('unlockInput').value;
  if (entered !== p.password) {
    showToast('❌ Contraseña incorrecta', 'error');
    return;
  }
  openModal(p);
}

function openModal(p) {
  currentPasteId = p.id;
  p.views++;
  localStorage.setItem('pv_pastes', JSON.stringify(localPastes));
  renderPastes();

  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalMeta').innerHTML = `
    <span>🌐 <strong>${p.language}</strong></span>
    <span>⏱ ${formatRelative(p.createdAt)}</span>
    <span>👁 <strong>${p.views}</strong> visitas</span>
    <span>📄 <strong>${p.content.split('\n').length}</strong> líneas</span>
    <span>📦 <strong>${p.content.length}</strong> chars</span>
  `;

  const lines = p.content.split('\n');
  const nums = lines.map((_, i) => i + 1).join('\n');
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-line-nums">${nums}</div>
    <div class="modal-code">${escapeHtml(p.content)}</div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function copyModalContent() {
  const p = localPastes.find(x => x.id === currentPasteId);
  if (!p) return;
  navigator.clipboard.writeText(p.content).then(() => showToast('✓ Contenido copiado', 'success'));
}

function deleteCurrentPaste() {
  if (!confirm('¿Eliminar este paste?')) return;
  localPastes = localPastes.filter(p => p.id !== currentPasteId);
  localStorage.setItem('pv_pastes', JSON.stringify(localPastes));
  renderPastes();
  closeModal();
  showToast('🗑 Paste eliminado', 'success');
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function generateId() {
  return Math.random().toString(36).substring(2, 9);
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatRelative(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60) return 'ahora';
  if (diff < 3600) return `hace ${Math.floor(diff/60)}m`;
  if (diff < 86400) return `hace ${Math.floor(diff/3600)}h`;
  return `hace ${Math.floor(diff/86400)}d`;
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
updateEditor();
renderPastes();

// Check URL param for shared paste
const params = new URLSearchParams(location.search);
if (params.get('p')) {
  const id = params.get('p');
  const p = localPastes.find(x => x.id === id);
  if (p) setTimeout(() => viewPaste(id), 300);
}
</script>
</body>
</html>

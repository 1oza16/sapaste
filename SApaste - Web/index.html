<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proyecto basado en WEpaste">
    <link rel="stylesheet" href="Styles/style.css">
    <link rel="shortcut icon" href="img/SApasteIcon.png" type="image/x-icon">
    <script src="script/editor.js"></script>
    <title>SApaste</title>
</head>
<body>
    <header>
        <h3 class="Logo">
            <img src="img/SApaste3.png" alt="" class="logo-claro" width="350px">
            <img src="img/SApaste2.png" alt="SApaste" class="logo-oscuro" width="350px">
        </h3>
    </header>
    <main>
        <div class="CuadroTexto">
            <!-- Estado + Reloj -->
            <div class="estado-bar">
                <div class="estado-badge sin-guardar" id="estadoBadge">
                    <span id="estadoPunto">●</span>
                    <span id="estadoTexto">Sin guardar</span>
                </div>
                <span class="reloj" id="reloj">00:00:00</span>
            </div>

            <!-- Título -->
            <input 
                type="text" 
                id="tituloClipboard" 
                placeholder="Título del clipboard..." 
                style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--cuadro-bg); color: var(--texto-color); font-size: 16px;"
            >

            <!-- URL + acciones -->
            <div class="url-acciones">
                <div id="urlClipboard">URL: (aún no generada)</div>
                <button class="btn-url" id="btnCopiarUrl" onclick="copiarUrl()" disabled>📋 Copiar</button>
                <div class="compartir-menu">
                    <button class="btn-url" id="btnCompartir" onclick="toggleCompartir()" disabled>↗ Compartir</button>
                    <div class="compartir-dropdown" id="compartirDropdown">
                        <a class="compartir-opcion" id="shareWhatsapp" href="#" target="_blank">💬 WhatsApp</a>
                        <a class="compartir-opcion" id="shareGmail"    href="#" target="_blank">✉️ Gmail</a>
                        <a class="compartir-opcion" id="shareTelegram" href="#" target="_blank">✈️ Telegram</a>
                        <div class="compartir-opcion" onclick="shareNativo()">📤 Más opciones...</div>
                    </div>
                </div>
            </div>

            <div class="toolbar">
                <button onclick="negrita()"><b>B</b></button>
                <button onclick="cursiva()"><i>I</i></button>
                <button onclick="subrayado()"><u>U</u></button>

                <span class="separator"></span>

                <button onclick="cmd('justifyLeft')">⯇</button>
                <button onclick="cmd('justifyCenter')">≡</button>
                <button onclick="cmd('justifyRight')">⯈</button>

                <span class="separator"></span>

                <button onclick="cmd('insertUnorderedList')">• Lista</button>
                <button onclick="cmd('insertOrderedList')">1. Lista</button>

                <span class="separator"></span>

                <button onclick="toggleDarkMode()" id="btnDarkMode">Modo Oscuro</button>

                <div class="acciones">
                    <button onclick="guardarContenido()">Guardar</button>
                    <button onclick="cargarContenido()">Recargar</button>
                    <button onclick="eliminarPaste()">Eliminar</button>
                </div>
            </div>

            <div id="editor" contenteditable="true"></div>

            <div id="contador">Caracteres: 0</div>

        </div>
    </main>

    <div id="spinner-overlay">
        <div class="spinner"></div>
    </div>  

    <!-- Modal confirmación -->
    <div id="modal-confirmacion">
        <div class="modal-box">
            <h3 id="modalTitulo">¿Estás seguro?</h3>
            <p id="modalMensaje">Esta acción no se puede deshacer</p>
            <div class="modal-botones">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-confirmar" id="btnConfirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Historial lateral -->
    <div id="historial-panel">
        <div id="historial-tab">
            <span class="historial-tab-texto">Ver Historial</span>
        </div>
        <div id="historial-contenido">
            <div id="historial-cabecera">
                <span>Historial</span>
                <button id="historial-borrar" onclick="limpiarHistorial()">Limpiar</button>
            </div>
            <div id="historial-lista">
                <div class="historial-vacio" id="historial-vacio">Sin actividad aún</div>
            </div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proyecto basado en WEpaste">
    <link rel="stylesheet" href="Styles/style.css">
    <link rel="shortcut icon" href="img/SApasteIcon.png" type="image/x-icon">
    <script src="script/editor.js"></script>
    <title>SApaste</title>
</head>
<body>
    <header>
        <h3 class="Logo">
            <img src="img/SApaste3.png" alt="" class="logo-claro" width="350px">
            <img src="img/SApaste2.png" alt="SApaste" class="logo-oscuro" width="350px">
        </h3>
    </header>
    <main>
        <div class="CuadroTexto">
            <!-- Título del clipboard -->
            <input 
                type="text" 
                id="tituloClipboard" 
                placeholder="Título del clipboard..." 
                style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--cuadro-bg); color: var(--texto-color); font-size: 16px;"
            >

            <!-- URL generada -->
            <div 
                id="urlClipboard" 
                style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px dashed var(--border-color); font-size: 14px; color: #888;"
            >
                URL: (aún no generada)
            </div>

            <div class="toolbar">
                <button onclick="negrita()"><b>B</b></button>
                <button onclick="cursiva()"><i>I</i></button>
                <button onclick="subrayado()"><u>U</u></button>

                <span class="separator"></span>

                <button onclick="cmd('justifyLeft')">⯇</button>
                <button onclick="cmd('justifyCenter')">≡</button>
                <button onclick="cmd('justifyRight')">⯈</button>

                <span class="separator"></span>

                <button onclick="cmd('insertUnorderedList')">• Lista</button>
                <button onclick="cmd('insertOrderedList')">1. Lista</button>

                <span class="separator"></span>

                <button onclick="toggleDarkMode()" id="btnDarkMode">Modo Oscuro</button>

                <div class="acciones">
                    <button onclick="guardarContenido()">Guardar</button>
                    <button onclick="cargarContenido()">Recargar</button>
                    <button onclick="eliminarPaste()">Eliminar</button>
                </div>
            </div>

            <div id="editor" contenteditable="true"></div>

            <div id="contador">Caracteres: 0</div>

        </div>
    </main>
</body>
</html>
